; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
; Custom board definition lives in boards/ — porting to other hardware =
; dropping a new JSON there and switching this one line.
board = pentagotchi
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
build_flags = 
	-std=gnu++17
	-DCONFIG_SPIRAM_SUPPORT=1
	-DCONFIG_SPIRAM_MODE_OCT=1
	-Wno-missing-field-initializers
	-DU8G2_16BIT=1
monitor_filters = esp32_exception_decoder, time
lib_deps = 
	adafruit/Adafruit GFX Library
	olikraus/u8g2@~2.28.0
	bblanchon/ArduinoJson@^7.0.0
	zinggjm/GxEPD2@^1.6.9
