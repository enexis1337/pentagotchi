# ============================================================
# src/idf_component.yml — зависимости через IDF Component Manager
#
# ВАЖНО: lib_deps в platformio.ini НЕ работает для framework=espidf —
# PlatformIO просто игнорирует его для этого framework (подтверждено
# несколькими источниками: библиотеки в lib_deps подхватываются только
# при framework=arduino). Поэтому ВСЕ зависимости идут здесь.
#
# arduinojson: официально опубликован на ESP Component Registry,
# подключается напрямую как ESP-IDF компонент — Arduino-as-component
# для него не требуется (ArduinoJson v7 работает как чистый C++ без
# зависимости от Arduino.h, если не использовать Stream/Print).
#
# u8g2: библиотека рендеринга шрифтов/графики для e-ink. Чистый C,
# подключается через git (у olikraus/u8g2 есть CMakeLists.txt в корне).
#
# espressif/arduino-esp32: требуется для GxEPD2 (библиотека драйвера
# e-ink). GxEPD2 использует Arduino.h, SPI.h, digitalWrite, pinMode и т.д.
# ============================================================
dependencies:
  bblanchon/arduinojson: "^7.3.0"
  olikraus/u8g2:
    git: https://github.com/olikraus/u8g2.git
  espressif/arduino-esp32: "^3.3.0"
